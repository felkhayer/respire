<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Respiration lente</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Respirer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #edf2ee;
  --ink: #1b2c2b;
  --muted: #566a68;
  --line: rgba(27,44,43,.16);
  --panel: rgba(27,44,43,.06);
  --in: #23796f;
  --out: #9c5f1d;
  --hold: #4a5f93;
  --on-accent: #ffffff;
  --btn-bg: #1b2c2b;
  --btn-ink: #edf2ee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b20; --ink: #e8f0ee; --muted: #93a8a6;
    --line: rgba(232,240,238,.18); --panel: rgba(232,240,238,.07);
    --in: #5fc4b5; --out: #e0b27a; --hold: #9db0d8;
    --on-accent: #0e1b20; --btn-bg: #e8f0ee; --btn-ink: #0e1b20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b20; --ink: #e8f0ee; --muted: #93a8a6;
  --line: rgba(232,240,238,.18); --panel: rgba(232,240,238,.07);
  --in: #5fc4b5; --out: #e0b27a; --hold: #9db0d8;
  --on-accent: #0e1b20; --btn-bg: #e8f0ee; --btn-ink: #0e1b20;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: "Avenir Next", "Nunito", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
main { width: 100%; max-width: 440px; padding: 18px 20px 28px; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 17px; font-weight: 600; margin: 0; color: var(--muted); letter-spacing: .02em; }

#phase { font-size: 34px; font-weight: 700; margin: 18px 0 6px; height: 42px; line-height: 42px; transition: color .5s; }
body[data-phase="in"] #phase { color: var(--in); }
body[data-phase="out"] #phase { color: var(--out); }
body[data-phase="h1"] #phase, body[data-phase="h2"] #phase { color: var(--hold); }

.dial { position: relative; width: min(78vw, 320px); aspect-ratio: 1; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.track { fill: none; stroke: var(--line); stroke-width: 6; }
#arc { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 150px 150px; }
#dot { fill: currentColor; }
.dial svg { color: var(--muted); transition: color .5s; }
body[data-phase="in"] .dial svg { color: var(--in); }
body[data-phase="out"] .dial svg { color: var(--out); }
body[data-phase="h1"] .dial svg, body[data-phase="h2"] .dial svg { color: var(--hold); }

.disc {
  position: absolute; left: 50%; top: 50%;
  width: 72%; height: 72%; margin: -36% 0 0 -36%;
  border-radius: 50%; background: var(--muted);
  transform: scale(.5); transition: background-color .5s;
  will-change: transform;
}
body[data-phase="in"] .disc { background: var(--in); }
body[data-phase="out"] .disc { background: var(--out); }
body[data-phase="h1"] .disc, body[data-phase="h2"] .disc { background: var(--hold); }
#count {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 56px; font-weight: 700; color: var(--on-accent);
  font-variant-numeric: tabular-nums; pointer-events: none;
}

#go {
  margin-top: 24px; min-width: 190px; height: 56px; border: 0; border-radius: 28px;
  background: var(--btn-bg); color: var(--btn-ink);
  font: inherit; font-size: 19px; font-weight: 700; cursor: pointer;
}
#go:focus-visible, .step button:focus-visible, .chip:focus-visible, .switch:focus-visible { outline: 3px solid var(--in); outline-offset: 3px; }
.stats { margin-top: 12px; color: var(--muted); font-size: 15px; display: flex; gap: 22px; font-variant-numeric: tabular-nums; }

.panel { width: 100%; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 20px; padding: 9px 14px; font: inherit; font-size: 15px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 12px; }
.row label, .row .lbl { font-size: 16px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer;
}
.step output { min-width: 84px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.switch {
  width: 52px; height: 30px; border-radius: 15px; border: 0; padding: 0; cursor: pointer;
  background: var(--line); position: relative; transition: background-color .2s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg); transition: transform .2s;
}
.switch[aria-checked="true"] { background: var(--in); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.hint { margin: 14px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.status { min-height: 1.5em; margin: 8px 0 0; font-size: 14px; color: var(--muted); text-align: center; }

/* ---------- Mode guidé ---------- */

/* ---------- Partage ---------- */
.share { margin-top: 14px; text-align: center; }
#share { min-height: 44px; }

/* ---------- Historique et statistiques ---------- */

/* ---------- Rappels ---------- */

@media (prefers-reduced-motion: reduce) { .disc, #phase, svg { transition: none; } }
</style>
</head>
<body data-phase="idle">
<main>
  <h1>Respiration lente</h1>
  <div id="phase">Prêt</div>

  <div class="dial">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle class="track" cx="150" cy="150" r="140"/>
      <circle id="arc" cx="150" cy="150" r="140" stroke-dasharray="879.65" stroke-dashoffset="879.65"/>
      <circle id="dot" cx="150" cy="10" r="9" opacity="0"/>
    </svg>
    <div class="disc" id="disc"></div>
    <div id="count">4</div>
  </div>

  <button id="go" type="button">Démarrer</button>
  <div class="stats"><span>Cycles : <b id="cycles">0</b></span><span>Durée : <b id="elapsed">0:00</b></span></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section class="panel">
    <div class="chips" id="chips"></div>
    <div id="rows"></div>
    <div class="row">
      <span class="lbl" id="soundlbl">Guide sonore</span>
      <button class="switch" id="sound" role="switch" aria-checked="true" aria-labelledby="soundlbl"></button>
    </div>
    <p class="hint">Le son monte d'une octave pendant l'inspiration et redescend pendant l'expiration : plus il est aigu, plus les poumons sont pleins. Les pauses gardent la même note, plus douce.</p>
  </section>

  <!-- ---------- Mode guidé ---------- -->

  <!-- ---------- Partage ---------- -->
  <div class="share"><button id="share" class="chip" type="button">Partager ces réglages</button></div>

  <!-- ---------- Historique et statistiques ---------- -->

  <!-- ---------- Rappels ---------- -->

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DEF = { inh: 4, hold1: 0, exh: 6, hold2: 0, total: 5, sound: true };
  var cfg = load();

  function load() {
    try { var s = localStorage.getItem('respiration-cfg'); if (s) return Object.assign({}, DEF, JSON.parse(s)); } catch (e) {}
    return Object.assign({}, DEF);
  }
  function save() { try { localStorage.setItem('respiration-cfg', JSON.stringify(cfg)); } catch (e) {} }
  // ---------- Événements ----------
  // Les fonctionnalités annexes s'abonnent au cycle de vie de la séance (on('start'), on('stop'))
  // plutôt que de modifier start() / stop().
  var listeners = {};
  function on(name, fn) { (listeners[name] = listeners[name] || []).push(fn); }
  function emit(name, data) { (listeners[name] || []).forEach(function (fn) { fn(data); }); }
  // Message bref annoncé aux lecteurs d'écran (zone role="status").
  function say(msg) { $('status').textContent = msg; }

  function fmt(n) { return String(n).replace('.', ',') + ' s'; }

  var FIELDS = [
    { k: 'inh',   label: 'Inspiration',          min: 1, max: 30 },
    { k: 'hold1', label: 'Pause poumons pleins', min: 0, max: 30 },
    { k: 'exh',   label: 'Expiration',           min: 1, max: 30 },
    { k: 'hold2', label: 'Pause poumons vides',  min: 0, max: 30 },
    { k: 'total', label: 'Durée de l\u2019exercice', min: 0, max: 60, step: 1, unit: 'min' }
  ];
  function fmtField(f) {
    if (f.k === 'total') return cfg.total === 0 ? 'Illimitée' : cfg.total + ' min';
    return fmt(cfg[f.k]);
  }
  function totalSuffix() { return cfg.total > 0 ? ' / ' + cfg.total + ':00' : ''; }
  var PRESETS = [
    { n: '4 – 6',   v: { inh: 4, hold1: 0, exh: 6, hold2: 0 } },
    { n: '5 – 5',   v: { inh: 5, hold1: 0, exh: 5, hold2: 0 } },
    { n: '4 – 7 – 8', v: { inh: 4, hold1: 7, exh: 8, hold2: 0 } },
    { n: 'Carrée 4',  v: { inh: 4, hold1: 4, exh: 4, hold2: 4 } }
  ];

  // ---------- Réglages ----------
  var rowsEl = $('rows'), chipsEl = $('chips'), outputs = {};
  FIELDS.forEach(function (f) {
    var row = document.createElement('div'); row.className = 'row';
    var lab = document.createElement('span'); lab.className = 'lbl'; lab.textContent = f.label;
    var step = document.createElement('div'); step.className = 'step';
    var minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '−'; minus.setAttribute('aria-label', 'Diminuer : ' + f.label);
    var out = document.createElement('output'); outputs[f.k] = out;
    var plus = document.createElement('button'); plus.type = 'button'; plus.textContent = '+'; plus.setAttribute('aria-label', 'Augmenter : ' + f.label);
    minus.onclick = function () { setVal(f, cfg[f.k] - (f.step || 0.5)); };
    plus.onclick = function () { setVal(f, cfg[f.k] + (f.step || 0.5)); };
    step.append(minus, out, plus); row.append(lab, step); rowsEl.appendChild(row);
  });
  function setVal(f, v) { cfg[f.k] = Math.min(f.max, Math.max(f.min, v)); save(); renderSettings(); if (running) schedule(); }

  PRESETS.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = p.n;
    b.onclick = function () { Object.assign(cfg, p.v); save(); renderSettings(); if (running) schedule(); };
    p.el = b; chipsEl.appendChild(b);
  });

  function renderSettings() {
    FIELDS.forEach(function (f) { outputs[f.k].textContent = fmtField(f); });
    if (!running && !hasRun) $('elapsed').textContent = '0:00' + totalSuffix();
    PRESETS.forEach(function (p) {
      var on = Object.keys(p.v).every(function (k) { return cfg[k] === p.v[k]; });
      p.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    $('sound').setAttribute('aria-checked', cfg.sound ? 'true' : 'false');
    if (!running) $('count').textContent = String(cfg.inh).replace('.', ',');
  }

  $('sound').onclick = function () {
    cfg.sound = !cfg.sound; save(); renderSettings();
    if (!cfg.sound) stopAudio(); else if (running) schedule();
  };

  // ---------- Phases ----------
  function phases() {
    var p = [{ k: 'in', n: 'Inspirez', d: cfg.inh }];
    if (cfg.hold1 > 0) p.push({ k: 'h1', n: 'Retenez', d: cfg.hold1 });
    p.push({ k: 'out', n: 'Expirez', d: cfg.exh });
    if (cfg.hold2 > 0) p.push({ k: 'h2', n: 'Pause', d: cfg.hold2 });
    return p;
  }
  function levelOf(ph, prog) {
    if (ph.k === 'in') return prog;
    if (ph.k === 'h1') return 1;
    if (ph.k === 'out') return 1 - prog;
    return 0;
  }
  // La phase en cours est repérée par sa nature et non par sa position : ajouter ou retirer une
  // pause en cours de séance décale les positions. Si la phase en cours a été retirée, on prend
  // la suivante (durée nulle) ; list.length signifie qu'il faut repartir sur un nouveau cycle.
  var ORDER = ['in', 'h1', 'out', 'h2'];
  function posOf(list, k) {
    var o = ORDER.indexOf(k);
    for (var j = 0; j < list.length; j++) if (ORDER.indexOf(list[j].k) >= o) return j;
    return list.length;
  }

  // ---------- Son ----------
  // Les variations de note sont programmées à l'avance sur l'horloge audio :
  // elles continuent donc même quand l'écran est en veille et que l'affichage est gelé.
  var ctx = null, osc = null, gain = null, refillTimer = null;
  var F0 = 220; // La3 → La4 : une octave
  function initAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} }
    if (osc) return;
    osc = ctx.createOscillator(); gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = F0; gain.gain.value = 0;
    osc.connect(gain); gain.connect(ctx.destination); osc.start();
  }
  function stopAudio() {
    if (!osc) return;
    var o = osc, g = gain; osc = null; gain = null;
    try {
      g.gain.cancelScheduledValues(ctx.currentTime);
      g.gain.setTargetAtTime(0, ctx.currentTime, 0.06);
      o.stop(ctx.currentTime + 0.5);
    } catch (e) {}
  }
  function schedule() {
    if (!running || !cfg.sound) return;
    initAudio();
    if (!osc) return;
    var now = ctx.currentTime, perfNow = performance.now();
    var list = phases();
    var i = posOf(list, cur);
    if (i >= list.length) i = 0;
    var el = Math.max(0, (perfNow - phaseStart) / 1000);
    var f = osc.frequency, g = gain.gain;
    var curGain = g.value;
    f.cancelScheduledValues(now); g.cancelScheduledValues(now);
    var ph = list[i];
    var lvl = levelOf(ph, Math.min(el / ph.d, 1));
    f.setValueAtTime(F0 * Math.pow(2, lvl), now);
    g.setValueAtTime(curGain, now);
    var endAt = cfg.total > 0 ? now + Math.max(0, cfg.total * 60 - (perfNow - startedAt) / 1000) : Infinity;
    var horizon = Math.min(endAt, now + 1800);
    var t = now, first = true, guard = 0;
    while (t < horizon && guard++ < 3000) {
      ph = list[i];
      var d = first ? Math.max(0.001, ph.d - el) : ph.d;
      var hold = (ph.k === 'h1' || ph.k === 'h2');
      if (!first) f.setValueAtTime(F0 * Math.pow(2, levelOf(ph, 0)), t);
      if (!hold) f.exponentialRampToValueAtTime(F0 * Math.pow(2, levelOf(ph, 1)), t + d);
      g.setTargetAtTime(hold ? 0.06 : 0.15, t, 0.08);
      t += d; i++;
      if (i >= list.length) { i = 0; list = phases(); }
      first = false;
    }
    if (endAt !== Infinity) {
      g.setTargetAtTime(0, endAt, 0.06);
      try { osc.stop(endAt + 0.6); } catch (e) {}
    }
  }

  // ---------- Écran allumé ----------
  var lock = null, noSleep = null;
  function noSleepOn() {
    try {
      if (typeof NoSleep !== 'undefined') { if (!noSleep) noSleep = new NoSleep(); noSleep.enable(); }
    } catch (e) {}
  }
  function getLock() {
    try {
      if (navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(noSleepOn);
        return;
      }
    } catch (e) {}
    noSleepOn();
  }
  function releaseLock() {
    try { if (lock) lock.release(); } catch (e) {}
    lock = null;
    try { if (noSleep) noSleep.disable(); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (running && document.visibilityState === 'visible') { getLock(); schedule(); }
  });

  // ---------- Boucle ----------
  var running = false, hasRun = false, cur = 'in', phaseStart = 0, startedAt = 0, cycles = 0;
  var C = 2 * Math.PI * 140;
  var arc = $('arc'), dot = $('dot'), disc = $('disc');

  function render(ph, prog, now) {
    var level = levelOf(ph, prog);
    document.body.setAttribute('data-phase', ph.k);
    $('phase').textContent = ph.n;
    disc.style.transform = 'scale(' + (0.5 + 0.5 * level).toFixed(4) + ')';
    arc.style.strokeDashoffset = (C * (1 - prog)).toFixed(2);
    var a = -Math.PI / 2 + 2 * Math.PI * prog;
    dot.setAttribute('cx', (150 + 140 * Math.cos(a)).toFixed(2));
    dot.setAttribute('cy', (150 + 140 * Math.sin(a)).toFixed(2));
    dot.setAttribute('opacity', '1');
    var remaining = Math.max(1, Math.ceil(ph.d * (1 - prog) - 0.001));
    $('count').textContent = remaining;
    $('cycles').textContent = cycles;
    var s = Math.floor((now - startedAt) / 1000);
    $('elapsed').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + totalSuffix();
  }

  function frame(now) {
    if (!running) return;
    if (cfg.total > 0 && (now - startedAt) / 1000 >= cfg.total * 60) { stop(true); return; }
    var list = phases();
    var idx = posOf(list, cur);
    if (idx >= list.length) { idx = 0; cycles++; }
    var ph = list[idx], el = (now - phaseStart) / 1000, guard = 0;
    while (el >= ph.d && guard++ < 2000) {
      phaseStart += ph.d * 1000;
      idx++;
      if (idx >= list.length) { idx = 0; cycles++; list = phases(); }
      ph = list[idx];
      el = (now - phaseStart) / 1000;
    }
    cur = ph.k;
    render(ph, Math.min(Math.max(el / ph.d, 0), 1), now);
    requestAnimationFrame(frame);
  }

  function start() {
    if (cfg.sound) initAudio();
    running = true; hasRun = true; cur = 'in'; cycles = 0;
    phaseStart = startedAt = performance.now();
    $('go').textContent = 'Arrêter';
    getLock();
    schedule();
    clearInterval(refillTimer);
    refillTimer = setInterval(function () { if (running) schedule(); }, 300000);
    requestAnimationFrame(frame);
    emit('start');
  }
  function stop(done) {
    var endedAt = performance.now();
    running = false;
    clearInterval(refillTimer);
    stopAudio(); releaseLock();
    $('go').textContent = 'Démarrer';
    $('phase').textContent = done === true ? 'Terminé' : 'Prêt';
    if (done === true) $('elapsed').textContent = cfg.total + ':00' + totalSuffix();
    document.body.setAttribute('data-phase', 'idle');
    disc.style.transform = 'scale(.5)';
    arc.style.strokeDashoffset = C;
    dot.setAttribute('opacity', '0');
    renderSettings();
    emit('stop', {
      done: done === true,
      seconds: done === true ? cfg.total * 60 : Math.floor((endedAt - startedAt) / 1000),
      cycles: cycles
    });
  }
  $('go').onclick = function () { running ? stop(false) : start(); };

  // ---------- Mode guidé ----------

  // ---------- Partage ----------
  // Lien « <page>#r=inh,hold1,exh,hold2,total ». Le fragment n'est jamais envoyé au serveur.
  var SHARE_KEYS = ['inh', 'hold1', 'exh', 'hold2', 'total'];
  function shareUrl() {
    return location.href.split('#')[0] + '#r=' + SHARE_KEYS.map(function (k) { return cfg[k]; }).join(',');
  }
  // undefined : pas un lien de réglages ; null : lien invalide ; objet : valeurs bornées et arrondies.
  function parseShared(hash) {
    if (typeof hash !== 'string' || hash.indexOf('#r=') !== 0) return undefined;
    var parts = hash.slice(3).split(',');
    if (parts.length !== SHARE_KEYS.length) return null;
    var out = {};
    for (var i = 0; i < SHARE_KEYS.length; i++) {
      var k = SHARE_KEYS[i], raw = parts[i];
      if (/^\s*$/.test(raw)) return null;
      var v = Number(raw);
      if (!isFinite(v)) return null;
      var f = FIELDS.filter(function (x) { return x.k === k; })[0], step = f.step || 0.5;
      v = Math.round(v / step) * step;
      out[k] = Math.max(f.min, Math.min(f.max, v));
    }
    return out;
  }
  var shared = parseShared(location.hash);
  if (shared) { Object.assign(cfg, shared); save(); say('Réglages importés'); }
  else if (shared === null) say('Lien de réglages invalide');
  if (shared !== undefined) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  $('share').onclick = function () {
    var url = shareUrl();
    function copy() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { say('Lien copié'); }, function () { say('Copiez ce lien : ' + url); });
      } else {
        say('Copiez ce lien : ' + url);
      }
    }
    if (navigator.share) {
      navigator.share({ title: 'Respiration lente', text: 'Mes réglages de respiration', url: url }).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        copy();
      });
    } else {
      copy();
    }
  };

  // ---------- Historique et statistiques ----------

  // ---------- Rappels ----------

  renderSettings();

  // ---------- Service worker (mode hors ligne) ----------
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
