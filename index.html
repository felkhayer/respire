<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Respiration lente</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1b20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Respirer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #edf2ee;
  --ink: #1b2c2b;
  --muted: #566a68;
  --line: rgba(27,44,43,.16);
  --panel: rgba(27,44,43,.06);
  --in: #23796f;
  --out: #9c5f1d;
  --hold: #4a5f93;
  --on-accent: #ffffff;
  --btn-bg: #1b2c2b;
  --btn-ink: #edf2ee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b20; --ink: #e8f0ee; --muted: #93a8a6;
    --line: rgba(232,240,238,.18); --panel: rgba(232,240,238,.07);
    --in: #5fc4b5; --out: #e0b27a; --hold: #9db0d8;
    --on-accent: #0e1b20; --btn-bg: #e8f0ee; --btn-ink: #0e1b20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b20; --ink: #e8f0ee; --muted: #93a8a6;
  --line: rgba(232,240,238,.18); --panel: rgba(232,240,238,.07);
  --in: #5fc4b5; --out: #e0b27a; --hold: #9db0d8;
  --on-accent: #0e1b20; --btn-bg: #e8f0ee; --btn-ink: #0e1b20;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: "Avenir Next", "Nunito", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  -webkit-tap-highlight-color: transparent;
}
main { width: 100%; max-width: 440px; padding: 18px 20px 28px; display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 17px; font-weight: 600; margin: 0; color: var(--muted); letter-spacing: .02em; }

#phase { font-size: 34px; font-weight: 700; margin: 18px 0 6px; height: 42px; line-height: 42px; transition: color .5s; }
body[data-phase="in"] #phase { color: var(--in); }
body[data-phase="out"] #phase { color: var(--out); }
body[data-phase="h1"] #phase, body[data-phase="h2"] #phase { color: var(--hold); }

.dial { position: relative; width: min(78vw, 320px); aspect-ratio: 1; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.track { fill: none; stroke: var(--line); stroke-width: 6; }
#arc { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 150px 150px; }
#dot { fill: currentColor; }
.dial svg { color: var(--muted); transition: color .5s; }
body[data-phase="in"] .dial svg { color: var(--in); }
body[data-phase="out"] .dial svg { color: var(--out); }
body[data-phase="h1"] .dial svg, body[data-phase="h2"] .dial svg { color: var(--hold); }

.disc {
  position: absolute; left: 50%; top: 50%;
  width: 72%; height: 72%; margin: -36% 0 0 -36%;
  border-radius: 50%; background: var(--muted);
  transform: scale(.5); transition: background-color .5s;
  will-change: transform;
}
body[data-phase="in"] .disc { background: var(--in); }
body[data-phase="out"] .disc { background: var(--out); }
body[data-phase="h1"] .disc, body[data-phase="h2"] .disc { background: var(--hold); }
#count {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 56px; font-weight: 700; color: var(--on-accent);
  font-variant-numeric: tabular-nums; pointer-events: none;
}

#go {
  margin-top: 24px; min-width: 190px; height: 56px; border: 0; border-radius: 28px;
  background: var(--btn-bg); color: var(--btn-ink);
  font: inherit; font-size: 19px; font-weight: 700; cursor: pointer;
}
#go:focus-visible, .step button:focus-visible, .chip:focus-visible, .seq:focus-visible, .switch:focus-visible { outline: 3px solid var(--in); outline-offset: 3px; }
.stats { margin-top: 12px; color: var(--muted); font-size: 15px; display: flex; gap: 22px; font-variant-numeric: tabular-nums; }

.panel { width: 100%; margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 20px; padding: 9px 14px; font: inherit; font-size: 15px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 12px; }
.row label, .row .lbl { font-size: 16px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer;
}
.step output { min-width: 84px; text-align: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.switch {
  width: 52px; height: 30px; border-radius: 15px; border: 0; padding: 0; cursor: pointer;
  background: var(--line); position: relative; transition: background-color .2s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--bg); transition: transform .2s;
}
.switch[aria-checked="true"] { background: var(--in); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.hint { margin: 14px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.status { min-height: 1.5em; margin: 8px 0 0; font-size: 14px; color: var(--muted); text-align: center; }

/* ---------- Mode guidé ---------- */
.guide { width: 100%; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.guide h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
.seqs { display: grid; gap: 8px; }
.seq {
  display: block; width: 100%; min-height: 44px; padding: 9px 14px; text-align: left;
  border: 1px solid var(--line); border-radius: 14px; background: transparent; color: var(--ink);
  font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
}
.seq small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.seq[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seq[aria-pressed="true"] small { color: var(--bg); }
.ghint { margin: 14px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
.gstep { min-height: 1.4em; margin: 8px 0 0; font-size: 15px; font-weight: 600; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- Partage ---------- */
.share { margin-top: 14px; text-align: center; }
#share { min-height: 44px; }

/* ---------- Historique et statistiques ---------- */
.history { width: 100%; margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); }
.history summary {
  display: flex; align-items: center; min-height: 44px; cursor: pointer;
  font-size: 16px; font-weight: 600; color: var(--ink);
}
.history summary:focus-visible, #clear-history:focus-visible {
  outline: 3px solid var(--in);
  outline-offset: 3px;
}
.history ul { list-style: none; margin: 4px 0 0; padding: 0; }
.history li {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px;
}
.history .when { overflow-wrap: anywhere; }
.history .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.history .empty { margin: 8px 0; color: var(--muted); font-size: 15px; }
.progress { margin: 4px 0 16px; }
.progress h3 { margin: 6px 0 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
.stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; }
.stat { margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; }
.stat dt { font-size: 13px; color: var(--muted); }
.stat dd { margin: 2px 0 0; font-size: 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
#stats-chart { display: block; width: 100%; height: auto; margin-top: 12px; }
#stats-chart .bar { fill: var(--in); fill-opacity: .55; }
#stats-chart .bar.today { fill-opacity: 1; }
#stats-chart .bar.zero { fill: var(--line); fill-opacity: 1; }
#stats-chart .bar.zero.today { fill: var(--muted); }
.stats-axis { display: flex; justify-content: space-between; margin-top: 4px; font-size: 13px; color: var(--muted); }
#clear-history {
  margin-top: 12px; min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 22px;
  background: transparent; color: var(--ink); font: inherit; font-size: 15px; cursor: pointer;
}

/* ---------- Rappels ---------- */
.reminder { width: 100%; margin-top: 18px; padding-top: 6px; border-top: 1px solid var(--line); }
.reminder summary {
  min-height: 44px; display: flex; align-items: center; cursor: pointer;
  font-size: 16px; font-weight: 600; color: var(--ink);
}
.reminder summary:focus-visible, .reminder input:focus-visible, .reminder button:focus-visible {
  outline: 3px solid var(--in);
  outline-offset: 3px;
}
.reminder .row { padding: 4px 0; }
.reminder .rem-help { margin: 12px 0 8px; font-size: 14px; color: var(--muted); line-height: 1.5; }
.reminder input[type="time"] {
  min-width: 120px; min-height: 44px; padding: 0 10px; font: inherit; font-size: 17px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
}
.reminder .action {
  min-height: 44px; margin-top: 8px; padding: 0 18px; border: 1px solid var(--line); border-radius: 22px;
  background: var(--btn-bg); color: var(--btn-ink); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
}

/* ---------- Internationalisation ---------- */
.langs { display: flex; gap: 8px; }
.langs .chip { min-width: 44px; min-height: 44px; padding: 0 12px; font-weight: 600; }

@media (prefers-reduced-motion: reduce) { .disc, #phase, svg { transition: none; } }
</style>
</head>
<body data-phase="idle">
<main>
  <h1 data-i18n="appTitle"></h1>
  <div id="phase"></div>

  <div class="dial">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle class="track" cx="150" cy="150" r="140"/>
      <circle id="arc" cx="150" cy="150" r="140" stroke-dasharray="879.65" stroke-dashoffset="879.65"/>
      <circle id="dot" cx="150" cy="10" r="9" opacity="0"/>
    </svg>
    <div class="disc" id="disc"></div>
    <div id="count">4</div>
  </div>

  <button id="go" type="button"></button>
  <div class="stats"><span><span data-i18n="cyclesLbl"></span> <b id="cycles">0</b></span><span><span data-i18n="durationLbl"></span> <b id="elapsed">0:00</b></span></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section class="panel">
    <div class="chips" id="chips"></div>
    <div id="rows"></div>
    <div class="row">
      <span class="lbl" id="langlbl" data-i18n="language"></span>
      <div class="langs" role="group" aria-labelledby="langlbl">
        <button type="button" class="chip" data-lang="fr" lang="fr" title="Français">FR</button>
        <button type="button" class="chip" data-lang="en" lang="en" title="English">EN</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl" id="soundlbl" data-i18n="sound"></span>
      <button class="switch" id="sound" role="switch" aria-checked="true" aria-labelledby="soundlbl"></button>
    </div>
    <p class="hint" data-i18n="hint"></p>
  </section>

  <!-- ---------- Mode guidé ---------- -->
  <section class="guide" aria-labelledby="guidettl">
    <h2 id="guidettl" data-i18n="guideTitle"></h2>
    <div class="seqs" id="seqs"></div>
    <p class="ghint" data-i18n="guideHint"></p>
  </section>

  <!-- ---------- Partage ---------- -->
  <div class="share"><button id="share" class="chip" type="button" data-i18n="share"></button></div>

  <!-- ---------- Historique et statistiques ---------- -->
  <details class="history" id="history">
    <summary data-i18n="history"></summary>
    <section class="progress" id="stats" aria-labelledby="stats-title" hidden>
      <h3 id="stats-title" data-i18n="progress"></h3>
      <dl class="stats-grid">
        <div class="stat"><dt data-i18n="sessions"></dt><dd id="stat-sessions"></dd></div>
        <div class="stat"><dt data-i18n="minutes"></dt><dd id="stat-minutes"></dd></div>
        <div class="stat"><dt data-i18n="streak"></dt><dd id="stat-streak"></dd></div>
        <div class="stat"><dt data-i18n="week"></dt><dd id="stat-week"></dd></div>
      </dl>
      <svg id="stats-chart" viewBox="0 0 280 64" role="img" aria-label=""></svg>
      <div class="stats-axis" aria-hidden="true"><span id="stats-from"></span><span id="stats-to"></span></div>
    </section>
    <ul id="history-list"></ul>
    <p class="empty" id="history-empty" data-i18n="noSessions"></p>
    <button type="button" id="clear-history" data-i18n="clearHistory"></button>
  </details>

  <!-- ---------- Rappels ---------- -->
  <details class="reminder" id="reminder">
    <summary data-i18n="reminder"></summary>
    <div class="row">
      <label for="remtime" data-i18n="remTime"></label>
      <input type="time" id="remtime" value="08:00" required>
    </div>
    <button type="button" class="action" id="remadd" data-i18n="remAdd"></button>
    <p class="rem-help" data-i18n="remHelp"></p>
  </details>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DEF = { inh: 4, hold1: 0, exh: 6, hold2: 0, total: 5, sound: true };
  var cfg = load();

  function load() {
    try { var s = localStorage.getItem('respiration-cfg'); if (s) return Object.assign({}, DEF, JSON.parse(s)); } catch (e) {}
    return Object.assign({}, DEF);
  }
  function save() { try { localStorage.setItem('respiration-cfg', JSON.stringify(cfg)); } catch (e) {} }
  // ---------- Événements ----------
  // Les fonctionnalités annexes s'abonnent au cycle de vie de la séance (on('start'), on('stop'))
  // plutôt que de modifier start() / stop().
  var listeners = {};
  function on(name, fn) { (listeners[name] = listeners[name] || []).push(fn); }
  function emit(name, data) { (listeners[name] || []).forEach(function (fn) { fn(data); }); }
  // Message bref annoncé aux lecteurs d'écran (zone role="status") : clé du dictionnaire et paramètres.
  // Le dernier message est retenu pour être retraduit si la langue change.
  var lastSay = null;
  function say(key, params) { lastSay = [key, params]; $('status').textContent = t(key, params); }

  // ---------- Internationalisation ----------
  // Le français est la langue de référence. Une valeur tableau est un pluriel [singulier, pluriel],
  // choisi par PLURAL selon le paramètre n. « {nom} » est remplacé par le paramètre du même nom.
  var I18N = {
    fr: {
      appTitle: 'Respiration lente',
      start: 'Démarrer', stop: 'Arrêter', ready: 'Prêt', done: 'Terminé',
      ph_in: 'Inspirez', ph_h1: 'Retenez', ph_out: 'Expirez', ph_h2: 'Pause',
      cyclesLbl: 'Cycles :', durationLbl: 'Durée :',
      f_inh: 'Inspiration', f_hold1: 'Pause poumons pleins', f_exh: 'Expiration', f_hold2: 'Pause poumons vides',
      f_total: 'Durée de l’exercice',
      less: 'Diminuer : {x}', more: 'Augmenter : {x}',
      unlimited: 'Illimitée', square4: 'Carrée 4', decSep: ',',
      language: 'Langue', sound: 'Guide sonore',
      hint: "Le son monte d'une octave pendant l'inspiration et redescend pendant l'expiration : plus il est aigu, plus les poumons sont pleins. Les pauses gardent la même note, plus douce.",
      guideTitle: 'Mode guidé',
      guideHint: "Chaque séquence enchaîne plusieurs rythmes ; le changement a lieu à la fin d'un cycle. Choisir un préréglage ou modifier un réglage quitte le mode guidé.",
      g_detente: 'Détente', g_sommeil: 'Endormissement', g_concentration: 'Concentration',
      step: 'Étape {i} / {n} · {name}',
      share: 'Partager ces réglages', shareText: 'Mes réglages de respiration',
      imported: 'Réglages importés', badLink: 'Lien de réglages invalide',
      copied: 'Lien copié', copyThis: 'Copiez ce lien : {url}',
      history: 'Historique', progress: 'Progression',
      sessions: 'Séances', minutes: 'Minutes', streak: 'Série', week: '7 derniers jours',
      noSessions: 'Aucune séance enregistrée', clearHistory: 'Effacer l’historique',
      confirmClear: 'Effacer tout l’historique des séances ?', cleared: 'Historique effacé',
      cycles: ['{n} cycle', '{n} cycles'], days: ['{n} jour', '{n} jours'],
      chart: 'Minutes de pratique par jour sur 14 jours : {list} ; aujourd’hui {today} min',
      reminder: 'Rappel quotidien', remTime: 'Heure du rappel', remAdd: 'Ajouter à mon agenda',
      remHelp: 'Le rappel est confié à l’agenda de votre téléphone : aucun serveur, aucune donnée ne quitte l’appareil, et cela fonctionne hors ligne.',
      remDone: 'Rappel téléchargé : ouvrez le fichier pour l’ajouter à votre agenda',
      icsDesc: 'Prenez dix minutes pour respirer lentement, sans écran.', icsFile: 'respirer-rappel.ics'
    },
    en: {
      appTitle: 'Slow breathing',
      start: 'Start', stop: 'Stop', ready: 'Ready', done: 'Done',
      ph_in: 'Breathe in', ph_h1: 'Hold', ph_out: 'Breathe out', ph_h2: 'Rest',
      cyclesLbl: 'Cycles:', durationLbl: 'Time:',
      f_inh: 'Inhale', f_hold1: 'Hold, lungs full', f_exh: 'Exhale', f_hold2: 'Hold, lungs empty',
      f_total: 'Session length',
      less: 'Decrease: {x}', more: 'Increase: {x}',
      unlimited: 'Unlimited', square4: 'Square 4', decSep: '.',
      language: 'Language', sound: 'Sound guide',
      hint: 'The tone rises by an octave as you breathe in and falls back as you breathe out: the higher it is, the fuller your lungs. Pauses keep the same, softer note.',
      guideTitle: 'Guided mode',
      guideHint: 'Each sequence chains several rhythms; the change happens at the end of a cycle. Choosing a preset or changing a setting leaves guided mode.',
      g_detente: 'Relax', g_sommeil: 'Sleep', g_concentration: 'Focus',
      step: 'Step {i} / {n} · {name}',
      share: 'Share these settings', shareText: 'My breathing settings',
      imported: 'Settings imported', badLink: 'Invalid settings link',
      copied: 'Link copied', copyThis: 'Copy this link: {url}',
      history: 'History', progress: 'Progress',
      sessions: 'Sessions', minutes: 'Minutes', streak: 'Streak', week: 'Last 7 days',
      noSessions: 'No sessions recorded yet', clearHistory: 'Clear history',
      confirmClear: 'Clear the whole session history?', cleared: 'History cleared',
      cycles: ['{n} cycle', '{n} cycles'], days: ['{n} day', '{n} days'],
      chart: 'Practice minutes per day over 14 days: {list}; today {today} min',
      reminder: 'Daily reminder', remTime: 'Reminder time', remAdd: 'Add to my calendar',
      remHelp: 'The reminder is handed to your phone’s calendar: no server, no data leaves the device, and it works offline.',
      remDone: 'Reminder downloaded: open the file to add it to your calendar',
      icsDesc: 'Take ten minutes to breathe slowly, away from screens.', icsFile: 'breathing-reminder.ics'
    }
  };
  // Index de la forme : 0 singulier, 1 pluriel (en français, 0 et 1 sont au singulier).
  var PLURAL = {
    fr: function (n) { return n < 2 ? 0 : 1; },
    en: function (n) { return n === 1 ? 0 : 1; }
  };
  // Préférence dans sa propre clé : la config des réglages (respiration-cfg) et le lien de partage
  // ne dépendent pas de la langue.
  var LANG_KEY = 'respiration-lang';
  function loadLang() {
    try { var s = localStorage.getItem(LANG_KEY); if (I18N.hasOwnProperty(s)) return s; } catch (e) {}
    return /^fr(-|$)/i.test(navigator.language || '') ? 'fr' : 'en';
  }
  var lang = loadLang();
  function t(key, params) {
    var v = I18N[lang].hasOwnProperty(key) ? I18N[lang][key] : I18N.fr[key];
    if (Array.isArray(v)) v = v[PLURAL[lang](params.n)];
    return String(v).replace(/\{(\w+)\}/g, function (m, k) { return params && k in params ? params[k] : m; });
  }
  // Nombre avec le séparateur décimal de la langue : 4,5 / 4.5.
  function num(n) { return String(n).replace('.', t('decSep')); }
  // Locale des dates : celle du navigateur si elle est de la langue choisie (en-GB, fr-CA…), sinon la langue.
  function locale() {
    var n = navigator.language || '';
    return n.toLowerCase().indexOf(lang) === 0 ? n : lang;
  }
  function translatePage() {
    document.documentElement.lang = lang;
    document.title = t('appTitle');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
  }
  // Changement immédiat, sans rechargement : chaque partie de l'interface s'abonne à on('lang').
  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    translatePage();
    emit('lang');
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {

  // Bouton principal et phase affichée, y compris pendant une séance (sans attendre l'image suivante).

      { n: '4 – 8', min: 3, v: rh(4, 0, 8, 0) }] },

  // ---------- Historique et statistiques ----------

  // Statistiques : jours identifiés par (année, mois, jour) locaux, jamais par division de millisecondes
  // (un jour de changement d'heure dure 23 h ou 25 h).
  function dayKey(date) { return date.getFullYear() * 10000 + date.getMonth() * 100 + date.getDate(); }
  function localDay(now, back) { return new Date(now.getFullYear(), now.getMonth(), now.getDate() - back); }
  function computeStats(h, now) {
    var perDay = {}, seconds = 0, i;
    h.forEach(function (e) {
      var k = dayKey(new Date(e.d));
      perDay[k] = (perDay[k] || 0) + e.s;
      seconds += e.s;
    });
    var keys = [];
    for (i = 13; i >= 0; i--) keys.push(dayKey(localDay(now, i)));
    var week = 0;
    for (i = 7; i < 14; i++) week += perDay[keys[i]] || 0;
    var streak = 0, back = perDay[keys[13]] ? 0 : 1;
    while (perDay[dayKey(localDay(now, back + streak))]) streak++;
    return {
      sessions: h.length, minutes: Math.round(seconds / 60), streak: streak,
      week: Math.round(week / 60),
      perDay: keys.map(function (k) { return (perDay[k] || 0) / 60; }),
      first: localDay(now, 13), last: localDay(now, 0)
    };
  }
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function renderStats(h) {
    $('stats').hidden = h.length === 0;
    if (h.length === 0) return;
    var st = computeStats(h, new Date());
    $('stat-sessions').textContent = st.sessions;
    $('stat-minutes').textContent = st.minutes;
    $('stat-streak').textContent = t('days', { n: st.streak });
    $('stat-week').textContent = st.week + ' min';
    var svg = $('stats-chart'), max = Math.max.apply(null, st.perDay), labels = [];
    svg.textContent = '';
    st.perDay.forEach(function (m, i) {
      var hgt = m > 0 ? Math.max(3, 60 * m / max) : 2;
      var r = document.createElementNS(SVG_NS, 'rect');
      r.setAttribute('class', 'bar' + (m > 0 ? '' : ' zero') + (i === 13 ? ' today' : ''));
      r.setAttribute('x', i * 20); r.setAttribute('width', 16);
      r.setAttribute('y', 62 - hgt); r.setAttribute('height', hgt);
      r.setAttribute('rx', 2);
      svg.appendChild(r);
      labels.push(Math.round(m));
    });
    svg.setAttribute('aria-label', t('chart', { list: labels.join(', '), today: labels[13] }));
    $('stats-from').textContent = shortDate.format(st.first);
    $('stats-to').textContent = shortDate.format(st.last);
  }
  // Recalcul à l'ouverture : couvre le passage de minuit si l'onglet est resté ouvert.
  $('history').addEventListener('toggle', function () { if ($('history').open) renderHistory(); });
  function renderHistory() {
    var all = loadHistory(), h = all.slice(-HISTORY_SHOWN).reverse(), list = $('history-list');
    renderStats(all);
    list.textContent = '';
    h.forEach(function (e) {
      var li = document.createElement('li');
      var when = document.createElement('span'); when.className = 'when'; when.textContent = dateFmt.format(new Date(e.d));
      var meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = Math.floor(e.s / 60) + ':' + String(e.s % 60).padStart(2, '0') + ' · ' +
        t('cycles', { n: e.c }) + ' · ' + entryLabel(e);
      li.append(when, meta); list.appendChild(li);
    });
    $('history-empty').hidden = h.length > 0;
    $('clear-history').hidden = h.length === 0;
  }
  $('clear-history').onclick = function () {
    if (!confirm(t('confirmClear'))) return;
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
    renderHistory();
    say('cleared');
  };
  renderHistory();
  on('lang', function () { makeDateFormats(); renderHistory(); });

  // ---------- Rappels ----------
  // Sans serveur, pas de notification fiable : le rappel est un fichier agenda (.ics) quotidien.
  var REM_KEY = 'respiration-reminder', REM_DEF = '08:00';
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function validTime(s) { return typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  function loadReminder() {
    try { var s = localStorage.getItem(REM_KEY); if (validTime(s)) return s; } catch (e) {}
    return REM_DEF;
  }
  function saveReminder(v) { try { localStorage.setItem(REM_KEY, v); } catch (e) {} }
  // Premier créneau à venir pour « hh:mm » : aujourd'hui s'il est strictement postérieur à now,
  // sinon demain. Renvoie la date locale flottante « YYYYMMDDTHHMM00 ».
  function reminderStart(now, hhmm) {
    var h = +hhmm.slice(0, 2), m = +hhmm.slice(3, 5);
    var y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
    var t = new Date(y, mo, d, h, m, 0);
    if (t.getTime() <= now.getTime()) t = new Date(y, mo, d + 1, h, m, 0);
    return t.getFullYear() + pad2(t.getMonth() + 1) + pad2(t.getDate()) + 'T' + hhmm.slice(0, 2) + hhmm.slice(3, 5) + '00';
  }
  function icsText(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  // Lignes de 75 caractères au plus : la suite est repliée (CRLF + espace), comme l'exige la RFC 5545.
  function icsFold(line) {
    var out = line.slice(0, 70);
    for (var i = 70; i < line.length; i += 69) out += '\r\n ' + line.slice(i, i + 69);
    return out;
  }
  function buildIcs(now, hhmm) {
    var stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    var url = location.href.split('#')[0];
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Respirer//' + lang.toUpperCase(), 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:' + now.getTime() + '@respirer',
      'DTSTAMP:' + stamp,
      'DTSTART:' + reminderStart(now, hhmm),
      'DURATION:PT10M',
      'RRULE:FREQ=DAILY',
      'SUMMARY:' + icsText(t('appTitle')),
      'DESCRIPTION:' + icsText(t('icsDesc')),
      'URL:' + url,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(t('appTitle')), 'TRIGGER:PT0M', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'
    ].map(icsFold).join('\r\n') + '\r\n';
  }
  var remInput = $('remtime');
  remInput.value = loadReminder();
  remInput.addEventListener('input', function () { if (validTime(remInput.value)) saveReminder(remInput.value); });
  $('remadd').onclick = function () {
    var hhmm = validTime(remInput.value) ? remInput.value : loadReminder();
    var blob = new Blob([buildIcs(new Date(), hhmm)], { type: 'text/calendar;charset=utf-8' });
    var href = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = href; a.download = t('icsFile');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(href);
    say('remDone');
  };

  renderSettings();

  // ---------- Service worker (mode hors ligne) ----------
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
</html>
